 <!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happiest Birthday Haider!</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;padding:18px}
.c{background:#fff;border-radius:26px;padding:20px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.slider{position:relative;height:380px;border-radius:18px;overflow:hidden;border:4px solid #764ba2;margin:14px 0}
.sl{position:absolute;inset:0;opacity:0;transition:1s}.sl.a{opacity:1}.sl img{width:100%;height:100%;object-fit:cover}
.btn{width:100%;padding:14px;border:none;border-radius:50px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:18px;font-weight:700}
#letter{display:none;text-align:left;background:#fdf6ff;padding:18px;border-radius:14px;line-height:1.7;margin-top:14px;border:2px dashed #d8b4fe}#letter.show{display:block}
</style></head>
<body><div class="c">
<h1 style="color:#764ba2;font-family:cursive;font-size:36px">Happiest Birthday<br>Haider! 🎂</h1>
<p style="color:#999;font-size:11px;letter-spacing:2px">MY FAVOURITE PERSON</p>
<div class="slider">
<div class="sl a"><img src="pic1.jpg"></div>
<div class="sl"><img src="pic2.jpg"></div>
<div class="sl"><img src="pic3.jpg"></div>
</div>
<p style="color:#666">Mominah ka surprise ♥</p>
<button class="btn" id="b" onclick="document.getElementById('letter').classList.add('show');this.innerHTML='💌 Khat Khul Gaya!'">🎁 Mera Khat Kholein</button>
<div id="letter"><b style="color:#764ba2">Mere Pyare Haider,</b><br><br>
Allah aapko hamesha khush rakhe, sehat de, izzat de. Aap meri zindagi ka sabse khoobsurat hissa hain.<br><br>
<b>Happy Birthday Jaan! 🎂❤️</b><br><br>~ Aapki Mominah</div>
</div>
<script>
let cur=0,sl=document.querySelectorAll('.sl');
setInterval(function(){sl[cur].classList.remove('a');cur=(cur+1)%sl.length;sl[cur].classList.add('a')},3000);
</script></body></html>
